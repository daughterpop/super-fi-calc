<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console -->
    <meta name="google-site-verification" content="ZgrRHmOiJxSyJvdsQvYmljn-MANfPGwwxJseQzPL5lA" />
    <meta name="google-site-verification" content="FTi0e8j5kbGsSKbnln2AHOnFrV9EbyghxqSpHqWn-C0" />

    <!-- Default SEO (overridden per-route by RouteSeo + react-helmet-async) -->
    <title>Via Fidelitatis — Faithful FI Tools for Catholic Families</title>
    <meta
      name="description"
      content="Practical financial independence tools for Catholic families. FI calculator for college, mortgage, and family expenses — plus faith-filled stewardship resources."
    />
    <meta
      name="keywords"
      content="Catholic financial independence, FI calculator, faithful stewardship, Catholic family finance, FIRE Catholic, generational wealth faith, Via Fidelitatis"
    />
    <link rel="canonical" href="https://www.viafidelitatis.com/" />

    <!-- Open Graph / Social defaults -->
    <meta property="og:title" content="Via Fidelitatis — Faithful FI for Catholic Families" />
    <meta
      property="og:description"
      content="Tools and insights to help Catholic families build financial independence with faith, purpose, and generational vision."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.viafidelitatis.com/" />
    <meta property="og:site_name" content="Via Fidelitatis" />
    <meta property="og:image" content="https://www.viafidelitatis.com/api/og?kind=home&title=Via%20Fidelitatis" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Via Fidelitatis — Freedom to live your vocation" />

    <!-- Twitter defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Via Fidelitatis — Faithful FI Tools" />
    <meta
      name="twitter:description"
      content="Financial independence tools for Catholic families building freedom with fidelity."
    />
    <meta name="twitter:image" content="https://www.viafidelitatis.com/api/og?kind=home&title=Via%20Fidelitatis" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Note: Unique title, description, canonical, OG, Twitter, and JSON-LD
         are injected per route by src/components/RouteSeo.jsx via react-helmet-async.
         Google and modern crawlers that execute JS will see the correct tags. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
