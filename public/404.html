<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Via Fidelitatis</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f9fafb; color: #111827; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 32rem; padding: 3rem 1.5rem; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.75rem; margin: 1rem 0 0.5rem; }
      p { color: #4b5563; line-height: 1.6; margin: 0 0 1.75rem; }
      nav { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      a { display: inline-block; padding: 0.6rem 1.1rem; border-radius: 0.5rem; font-weight: 600; text-decoration: none; }
      a.primary { background: #047857; color: #fff; }
      a.primary:hover { background: #065f46; }
      a.secondary { color: #047857; border: 1px solid #a7f3d0; background: #fff; }
      a.secondary:hover { background: #ecfdf5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Via Fidelitatis" />
      <h1>Page not found</h1>
      <p>This road does not go anywhere. The page may have moved, or the link may be mistyped.</p>
      <nav>
        <a class="primary" href="/">Home</a>
        <a class="secondary" href="/blog">Read the blog</a>
        <a class="secondary" href="/calculators">Calculators</a>
      </nav>
    </main>
  </body>
</html>
